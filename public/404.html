<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Dharmesh Sharma — Portfolio</title>
    <script>
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var base = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      window.location.replace(base);
    </script>
  </head>
  <body style="background-color: #050505; color: #f5f5f5; font-family: system-ui, sans-serif;">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center;">
      <p style="color: #A1A1A1; font-size: 14px;">Redirecting...</p>
    </div>
  </body>
</html>
